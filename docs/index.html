<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Wander 피드</title>

    <link rel="stylesheet" href="./styles.css" />

    <script src="https://unpkg.com/botframework-directlinejs@0.16.0/dist/directline.js"></script>
  </head>

  <body>
    <main class="page">
      <header class="header">
        <div>
          <p class="eyebrow">WANDER</p>
          <h1>유용한 피드 만들기</h1>

          <p class="subtitle">
            궁금한 것을 Wander에 알려 주세요. 상위 에이전트가 필요한 콘텐츠를
            모으고, 걸러 내고, 설명해 드립니다.
          </p>
        </div>

        <div
          id="connectionStatus"
          class="connection-status"
        >
          연결되지 않음
        </div>
      </header>

      <section class="request-panel">
        <form id="feedForm">
          <div class="field">
            <label for="prompt">무엇이 궁금한가요?</label>

            <textarea
              id="prompt"
              name="prompt"
              rows="4"
              placeholder="Wander에게 이야기해 보세요. 예: 시간이 조금 남아서 차분하고 유익한 우주 이야기를 보고 싶어요."
              required
            ></textarea>
          </div>

          <button id="submitButton" type="submit">
            피드 만들기
          </button>
        </form>
      </section>

      <section class="status-area">
        <p id="statusMessage">
          상위 에이전트에 연결하는 중...
        </p>
      </section>

      <section
        id="errorPanel"
        class="error-panel hidden"
        aria-live="assertive"
      ></section>

      <section
        id="feed"
        class="feed"
        aria-live="polite"
      ></section>

      <details class="debug-panel">
        <summary>
          <span>디버그 정보 기록</span>
          <button
            id="clearDebugButton"
            class="clear-debug-button"
            type="button"
          >
            기록 지우기
          </button>
        </summary>
        <pre id="debugOutput">아직 받은 응답이 없습니다.</pre>
      </details>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
