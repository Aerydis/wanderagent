<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Wander Feed</title>

    <link rel="stylesheet" href="/styles.css" />

    <script src="https://unpkg.com/botframework-directlinejs@0.16.0/dist/directline.js"></script>
  </head>

  <body>
    <main class="page">
      <header class="header">
        <div>
          <p class="eyebrow">WANDER</p>
          <h1>Build a useful feed</h1>

          <p class="subtitle">
            Tell Wander what you are curious about. The parent agent will
            collect, filter, and explain a feed for you.
          </p>
        </div>

        <div
          id="connectionStatus"
          class="connection-status"
        >
          Not connected
        </div>
      </header>

      <section class="request-panel">
        <form id="feedForm">
          <div class="field">
            <label for="prompt">What are you curious about?</label>

            <textarea
              id="prompt"
              name="prompt"
              rows="4"
              placeholder="Talk to Wander. Example: I have some free time and want calm, useful stories about space."
              required
            ></textarea>
          </div>

          <button id="submitButton" type="submit">
            Create feed
          </button>
        </form>
      </section>

      <section class="status-area">
        <p id="statusMessage">
          Connecting to the parent agent...
        </p>
      </section>

      <section
        id="errorPanel"
        class="error-panel hidden"
        aria-live="assertive"
      ></section>

      <section
        id="feed"
        class="feed"
        aria-live="polite"
      ></section>

      <details class="debug-panel">
        <summary>
          <span>Debug information history</span>
          <button
            id="clearDebugButton"
            class="clear-debug-button"
            type="button"
          >
            Clear history
          </button>
        </summary>
        <pre id="debugOutput">No response received yet.</pre>
      </details>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
